name: My First Workflow
on: push

jobs:
    first_job:
        runs-on: ubuntu-latest 
        steps:
          - name: Chekout Repo
            uses: actions/checkout@v4  
          
          - name: Welcome message
            run: echo "Steve"

          - name: List and Read file
            run: |
                ls -ltra
                cat README.md

          - name: Generate ASCII Artwork
            run: coway -f dragon "Run for cover, I am a DRAGON . . . RAWR" >> dragon.txt